[package]
name = "uuob-kit-gtk"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "What every UUOB app's Linux window shares (GTK 4, Libadwaita, Relm4): the connect screen, the logo, the update button."

# Not part of UUOB's own workspace: it needs GTK, and only apps use it.
[workspace]

[dependencies]
uuob-client = { path = "../../client", optional = true }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }
serde_json = "1"

[features]
# The connect screen, the update button, Settings and the time field. UUOB
# itself uses the kit without it (`default-features = false`).
default = ["client"]
client = ["dep:uuob-client"]
